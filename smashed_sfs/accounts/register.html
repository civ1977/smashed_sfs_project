{% extends 'base.html' %}

{% block content %}
<h2>📝 Teacher Registration</h2>
<p>Create your account to access the SF9/SF10 system.</p>

<form method="POST">
    {% csrf_token %}
    
    <div class="form-group">
        <label>Username:</label>
        <input type="text" name="username" required>
        <small>Choose a unique username</small>
    </div>
    
    <div class="form-group">
        <label>Full Name:</label>
        <input type="text" name="full_name" required>
        <small>Your complete name as it appears on school records</small>
    </div>
    
    <div class="form-group">
        <label>Position:</label>
        <input type="text" name="position" placeholder="Teacher I, Teacher II, etc." required>
    </div>
    
    <div class="form-group">
        <label>Email Address:</label>
        <input type="email" name="email" required>
    </div>
    
    <div class="form-group">
        <label>Password:</label>
        <input type="password" name="password" required>
        <small>Must be at least 8 characters</small>
    </div>
    
    <div class="form-group">
        <label>Confirm Password:</label>
        <input type="password" name="password_confirm" required>
    </div>
    
    <button type="submit" class="btn btn-success">Register</button>
    <p style="margin-top: 15px;">
        Already have an account? <a href="{% url 'login' %}">Login here</a>
    </p>
</form>
{% endblock %}
