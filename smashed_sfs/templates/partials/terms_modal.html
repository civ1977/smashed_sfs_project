<div id="termsModalOverlay" class="terms-modal-overlay" onclick="if (event.target === this) closeTermsModal();">
    <div class="terms-modal" role="dialog" aria-modal="true" aria-labelledby="termsModalTitle">
        <div class="terms-modal-header">
            <span id="termsModalTitle">User's Agreement</span>
            <button type="button" class="terms-modal-close" onclick="closeTermsModal()" aria-label="Close">&times;</button>
        </div>
        <iframe id="termsModalFrame" class="terms-modal-frame" title="User's Agreement"></iframe>
    </div>
</div>

<style>
    /* Closed by default (display: none) - only .is-open switches it to a
       visible flex overlay. Deliberately not relying on the [hidden]
       attribute for this: any author CSS `display` rule on the same
       element - which this needs, to center the modal - overrides the
       browser's own `[hidden] { display: none }` default regardless of
       specificity, so toggling `hidden` alone silently did nothing and the
       modal never actually closed. */
    .terms-modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(11, 20, 38, .55);
        align-items: center;
        justify-content: center;
        padding: var(--space-5);
        z-index: 1000;
    }
    .terms-modal-overlay.is-open {
        display: flex;
    }
    .terms-modal {
        background: #fff;
        border-radius: var(--radius-lg, 12px);
        width: min(720px, 100%);
        height: min(80vh, 820px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
    }
    .terms-modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--space-3) var(--space-4);
        border-bottom: 1px solid var(--accent-wash, #eee);
        font-weight: 700;
        color: var(--ink, #111);
        flex-shrink: 0;
    }
    .terms-modal-close {
        background: none;
        border: none;
        font-size: 26px;
        line-height: 1;
        cursor: pointer;
        color: var(--ink-soft, #555);
        padding: 0 var(--space-1);
    }
    .terms-modal-close:hover { color: var(--ink, #111); }
    .terms-modal-frame { flex: 1; width: 100%; border: 0; }
</style>

<script>
    function openTermsModal(event, url) {
        if (event) event.preventDefault();
        var frame = document.getElementById('termsModalFrame');
        if (!frame.getAttribute('src')) {
            frame.setAttribute('src', url);
        }
        document.getElementById('termsModalOverlay').classList.add('is-open');
        document.addEventListener('keydown', _termsModalEscHandler);
    }
    function closeTermsModal() {
        document.getElementById('termsModalOverlay').classList.remove('is-open');
        document.removeEventListener('keydown', _termsModalEscHandler);
    }
    function _termsModalEscHandler(e) {
        if (e.key === 'Escape') closeTermsModal();
    }
</script>
