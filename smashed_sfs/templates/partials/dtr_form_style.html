<!-- Shared by every page that renders partials/dtr_form_content.html - the
     employee's own editable/printable Daily Time Record (templates/accounts/dtr.html)
     and the registrar-facing read-only/bulk views (templates/school/dtr_view.html,
     templates/school/dtr_bulk_print.html). Keeping one copy here is what makes those
     an exact mirror of each other instead of three hand-maintained near-duplicates
     that drift apart over time. -->
<style>
    .dtr-form-zoom {
        zoom: 1.75;
        margin: var(--space-5) auto;
        width: fit-content;
    }
    /* Only ever shown at print time (see @media print below) - two
       identical copies of the same card side by side on one A4 sheet. */
    .dtr-print-sheet { display: none; }
    .dtr-print-gap { width: 1cm; flex-shrink: 0; border-left: 1px dashed #999; }
    .dtr-form {
        width: 8cm;
        margin: 0 auto;
        padding: 0.35cm 0.3cm;
        border: 1px solid var(--line);
        background: var(--card);
        font-family: Georgia, 'Times New Roman', serif;
        color: #1a1a1a;
        box-sizing: border-box;
    }
    .dtr-print-copy { flex-shrink: 0; }
    .dtr-top-rule {
        border-top: 2px solid #7a2020;
        border-bottom: 1px solid #7a2020;
        height: 2px;
        margin: -0.35cm -0.3cm 0.25cm;
    }
    .dtr-form-tag { font-size: 6.5pt; letter-spacing: .02em; }
    .dtr-title {
        text-align: center;
        font-size: 13pt;
        font-weight: 700;
        letter-spacing: .03em;
        margin: 0.1cm 0 0.3cm;
    }
    .dtr-name-line {
        border: none;
        border-bottom: 1px solid #000;
        text-align: center;
        font-weight: 700;
        font-size: 8.5pt;
        padding-bottom: 2px;
        min-height: 1.3em;
    }
    .dtr-name-label { text-align: center; font-style: italic; font-weight: 700; font-size: 7pt; margin-bottom: 0.2cm; }

    .dtr-meta { font-size: 7pt; font-style: italic; margin-bottom: 0.1cm; }
    .dtr-meta-month-row { display: flex; align-items: baseline; margin-bottom: 0.06cm; white-space: nowrap; }
    .dtr-meta-month-row .dtr-fill { flex: 1; margin-left: 4px; }
    .dtr-meta-cols { display: flex; justify-content: space-between; gap: 0.15cm; }
    .dtr-meta-left, .dtr-meta-right { flex: 1; min-width: 0; }
    .dtr-meta-indent { padding-left: 0.5cm; }
    .dtr-meta-right-row { display: flex; align-items: baseline; white-space: nowrap; }
    .dtr-meta-right-row .dtr-fill { flex: 1; margin-left: 4px; }
    .dtr-fill { display: inline-block; border-bottom: 1px solid #000; text-align: center; font-style: normal; min-width: 0.4cm; }

    .dtr-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        font-size: 6pt;
        margin: 0.05cm 0 0.08cm;
        border-top: 3px double #000;
        border-bottom: 3px double #000;
        border-left: 1.5pt solid #000;
        border-right: 1.5pt solid #000;
    }
    .dtr-table th, .dtr-table td {
        border: 0.5pt solid #000;
        text-align: center;
        padding: 0px 2px;
        line-height: 1.1;
        overflow: hidden;
    }
    .dtr-table th.dtr-thick-r, .dtr-table td.dtr-thick-r { border-right: 1.5pt solid #000; }
    .dtr-table thead th { font-weight: 700; padding: 2px 1px; }
    .dtr-col-day { width: 9%; }
    .dtr-day { font-weight: 700; }
    .dtr-table td:not(.dtr-day):not(.dtr-total-label) { height: 0.39cm; }
    .dtr-total-row td { font-weight: 700; }
    .dtr-total-row .dtr-total-label { text-align: center; font-size: 6.5pt; }
    /* Label rows (Saturday/Sunday/Holiday) drop their internal vertical
       borders - the cells themselves are unchanged/still one <td> each,
       but with no line left between them the label can overflow past its
       own narrow cell into the empty ones beside it instead of being cut
       off at a border. */
    .dtr-label-row td:not(.dtr-day) { border-left: none; border-right: none; }
    .dtr-table td.dtr-day-label-cell { text-align: left; overflow: visible; }
    .dtr-day-label-text {
        white-space: nowrap;
        font-style: italic;
        font-weight: 700;
        color: #555;
        font-size: 7.5pt;
    }
    /* Leave labels show the full leave name (e.g. "Special Emergency
       (Calamity) Leave"), not the short code, so unlike the fixed
       Holiday/Saturday/Sunday/Suspension labels above they need to be
       allowed to wrap - accounts/dtr.html's own script shrinks
       font-size first and only lets it actually wrap to 2 lines as a
       last resort for names too long to fit even at the smallest size. */
    .dtr-leave-label {
        white-space: normal;
        word-break: break-word;
        line-height: 1.05;
    }
    /* @media screen, not a .no-print-style ancestor selector - the
       editable card sits inside .no-print-sheet (only display:none'd at
       print time) while the two hidden .dtr-print-sheet copies have no
       such wrapper at all, so a class-based selector can't reliably tell
       them apart. This affordance is purely visual/interactive anyway
       (cursor, underline) and has no reason to render in the printed/
       exported PDF output regardless of which copy it's on. */
    @media screen {
        .dtr-leave-label[data-date] {
            cursor: pointer;
            text-decoration: underline dotted;
            text-underline-offset: 2px;
        }
    }

    .dtr-editable { cursor: text; font-size: 7.5pt; }
    .dtr-editable:hover { background: var(--bg-exhibit); }
    .dtr-editable:focus { outline: 1.5px solid var(--accent); outline-offset: -1.5px; background: var(--accent-wash); }
    .dtr-editable.dtr-just-saved { background: var(--good-wash); }

    .dtr-certify { font-size: 6.5pt; font-style: italic; line-height: 1.3; margin: 0 0 0.28cm; text-align: justify; }

    /* Same fixed, centered width as .dtr-signature-line below (the
       In-Charge line) - in the real card both signature lines are short
       and the same length, not full-width. */
    .dtr-employee-signature-line {
        border-bottom: 1px solid #000;
        width: 3.3cm;
        height: 0.8cm;
        margin: 0 auto 0.12cm;
        display: flex;
        align-items: flex-end;
        justify-content: center;
    }
    .dtr-signature-img { max-width: 100%; max-height: 0.75cm; object-fit: contain; }

    .dtr-verify {
        font-size: 6.5pt;
        font-style: italic;
        border-top: 3px double #000;
        padding-top: 0.1cm;
        margin-bottom: 0.12cm;
    }

    .dtr-footer { display: flex; justify-content: space-between; align-items: flex-end; gap: 0.2cm; }
    .dtr-footer-left { flex-shrink: 0; }
    .dtr-vanda-brand { font-weight: 700; font-size: 8pt; letter-spacing: .02em; margin-bottom: 1px; }
    .dtr-barcode {
        width: 2.3cm;
        height: 0.55cm;
        background-image: repeating-linear-gradient(
            90deg,
            #000 0, #000 0.6px, transparent 0.6px, transparent 1.4px,
            #000 1.4px, #000 2.6px, transparent 2.6px, transparent 3.4px,
            #000 3.4px, #000 3.8px, transparent 3.8px, transparent 4.8px
        );
        background-size: 100% 100%;
        /* Browsers drop background-image/background-color by default when
           printing (to save ink) unless told otherwise - without this the
           barcode (a pure CSS gradient, not a real <img>) silently
           disappears on the printed/PDF-saved page even though it shows
           fine on screen. */
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
    }
    .dtr-barcode-digits { font-size: 5.5pt; letter-spacing: .1em; font-family: 'Courier New', monospace; margin-top: 1px; }
    .dtr-footer-right { text-align: center; flex: 1; }
    .dtr-signature-line { border-bottom: 1px solid #000; width: 3.3cm; margin: 0 auto 2px; }
    .dtr-signature-label { font-size: 7pt; font-style: italic; }
    .dtr-instruction { font-size: 6.5pt; margin-top: 0; }

    @media print {
        @page { size: A4; margin: 1cm; }
        .no-print, .header, .alert { display: none !important; }
        body { background: #fff; }
        .container { box-shadow: none; margin: 0; padding: 0; max-width: none; }
        .no-print-sheet { display: none !important; }
        .dtr-print-sheet { display: flex; justify-content: center; align-items: flex-start; }
        .dtr-print-sheet .dtr-form { border: none; width: 8cm; margin: 0; }
    }
</style>
