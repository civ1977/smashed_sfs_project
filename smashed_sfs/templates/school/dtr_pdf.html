<html>
<head>
<style>
    /* Matches templates/accounts/dtr.html's physical-card design (Civil
       Service Form No. 48 / "VANDA F48") - each individual copy is still
       exactly 8cm x 22cm, but the page itself is A4 with two identical
       copies side by side (one employee per A4 sheet, cut apart along the
       gap - e.g. one copy for the employee, one for the office file).
       xhtml2pdf's CSS support is limited (no flexbox, no gradients), so
       bordered tables/divs stand in for the on-screen version's flex
       layout, the side-by-side placement is a 2-column table rather than
       flex, and the barcode is a small table of alternating black/white
       cells rather than a CSS gradient. */
    @page {
        size: A4;
        margin: 1cm;
    }
    body {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 6pt;
        color: #1a1a1a;
    }
    table.dtr-sheet {
        width: 100%;
        page-break-after: always;
    }
    table.dtr-sheet:last-of-type {
        page-break-after: avoid;
    }
    table.dtr-sheet td.dtr-sheet-cell {
        width: 8cm;
        padding: 0.3cm;
        vertical-align: top;
    }
    table.dtr-sheet td.dtr-sheet-gap {
        width: 1cm;
        border-left: 0.5pt dashed #999;
    }
    .dtr-form {
        width: 207pt;
    }
    table.dtr-top-rule-table {
        width: 207pt;
        margin-bottom: 3px;
    }
    .dtr-top-rule {
        border-top: 2px solid #7a2020;
        border-bottom: 1px solid #7a2020;
        font-size: 1px;
        line-height: 1px;
        padding: 0;
    }
    .dtr-form-tag {
        font-size: 6.5pt;
        line-height: 7pt;
        font-family: 'Times New Roman', serif;
    }
    .dtr-title {
        text-align: center;
        font-size: 13pt;
        line-height: 15pt;
        font-weight: bold;
        font-family: 'Times New Roman', serif;
        margin: 1px 0 5px;
    }
    .dtr-name-line {
        text-align: center;
        font-weight: bold;
        font-size: 8.5pt;
        line-height: 9pt;
        font-family: 'Times New Roman', serif;
        border-bottom: 1px solid #000;
        padding-bottom: 2px;
    }
    .dtr-name-label {
        text-align: center;
        font-style: italic;
        font-weight: bold;
        font-size: 7pt;
        line-height: 8pt;
        font-family: 'Times New Roman', serif;
        margin-bottom: 3px;
    }
    .dtr-meta {
        width: 207pt;
        font-size: 7pt;
        line-height: 7pt;
        font-style: italic;
        font-family: 'Times New Roman', serif;
        margin-bottom: 0px;
    }
    table.dtr-meta-month-table {
        width: 207pt;
        margin-bottom: 5pt;
    }
    .dtr-meta-month-table td {
        padding: 0;
        white-space: nowrap;
        line-height: 7pt;
    }
    .dtr-meta-cols td { vertical-align: top; padding: 0; }
    .dtr-meta-cols td div { white-space: nowrap; margin-bottom: 5pt; line-height: 7pt; }
    .dtr-meta-indent { padding-left: 14px; }
    table.dtr-meta-right-table td { padding: 0; white-space: nowrap; line-height: 7pt; }
    table.dtr-meta-right-table tr.dtr-meta-row-gap td { padding-bottom: 5pt; }
    .dtr-fill {
        border-bottom: 1px solid #000;
        text-align: center;
        font-style: normal;
        line-height: 7pt;
    }
    table.dtr-table {
        width: 207pt;
        border-collapse: collapse;
        font-size: 6pt;
        margin-bottom: 1px;
        border-top: 3px double #000;
        border-bottom: 3px double #000;
        border-left: 1.5pt solid #000;
        border-right: 1.5pt solid #000;
    }
    .dtr-table th, .dtr-table td {
        border: 0.5pt solid #000;
        text-align: center;
        vertical-align: middle;
        padding: 1px 2px 0px;
    }
    .dtr-table th.dtr-thick-r, .dtr-table td.dtr-thick-r {
        border-right: 1.5pt solid #000;
    }
    .dtr-table thead th {
        font-weight: bold;
    }
    .dtr-day {
        font-weight: bold;
    }
    .dtr-day-label {
        font-style: italic;
        font-weight: bold;
        color: #555;
        text-align: left;
        padding-left: 3px;
        font-size: 5.5pt;
    }
    .dtr-total-row td {
        font-weight: bold;
    }
    .dtr-total-label {
        text-align: center;
        font-size: 6.5pt;
    }
    table.dtr-certify-block {
        width: 207pt;
    }
    .dtr-certify {
        font-size: 6.5pt;
        font-style: italic;
        font-family: 'Times New Roman', serif;
        line-height: 1.3;
        padding: 0 2pt;
        text-align: justify;
    }
    .dtr-sig-row {
        padding-top: 0pt;
    }
    /* Plain standalone <div> borders don't reliably render in xhtml2pdf -
       only border-bottom on a table <td> does (proven by the meta fill
       lines above), so both signature lines use a small centered table
       instead of a div. */
    table.dtr-sig-table {
        margin-bottom: 2px;
    }
    .dtr-sig-fill {
        border-bottom: 1px solid #000;
        line-height: 7pt;
        padding: 0;
        text-align: center;
    }
    .dtr-sig-img {
        height: 18pt;
    }
    .dtr-verify {
        font-size: 6.5pt;
        line-height: 7.5pt;
        font-style: italic;
        font-family: 'Times New Roman', serif;
        border-top: 3px double #000;
        padding-top: 2px;
        margin-bottom: 1px;
    }
    .dtr-footer {
        width: 100%;
    }
    .dtr-footer td { vertical-align: bottom; }
    .dtr-vanda-brand {
        font-weight: bold;
        font-size: 8pt;
        margin-bottom: 1px;
    }
    table.dtr-barcode {
        border-collapse: collapse;
        margin-bottom: 1px;
    }
    table.dtr-barcode td {
        border: none;
        padding: 0;
        height: 11pt;
    }
    .dtr-barcode-digits {
        font-size: 5.5pt;
        font-family: 'Courier New', monospace;
        letter-spacing: 1px;
    }
    .dtr-footer-right {
        text-align: center;
    }
    .dtr-signature-label {
        font-size: 7pt;
        font-style: italic;
        font-family: 'Times New Roman', serif;
    }
    .dtr-instruction {
        font-size: 6.5pt;
        font-family: 'Times New Roman', serif;
        margin-top: 0;
    }
</style>
</head>
<body>
{% for form in forms %}
<table class="dtr-sheet" cellspacing="0" cellpadding="0">
    <tr>
        <td class="dtr-sheet-cell">
            <div class="dtr-form">
                {% include 'school/_dtr_form_content.html' %}
            </div>
        </td>
        <td class="dtr-sheet-gap"></td>
        <td class="dtr-sheet-cell">
            <div class="dtr-form">
                {% include 'school/_dtr_form_content.html' %}
            </div>
        </td>
    </tr>
</table>
{% endfor %}
</body>
</html>
