# nginx site config - reverse proxies to gunicorn over a unix socket and
# serves collected static files directly (faster than routing them through
# whitenoise/gunicorn, though whitenoise would also work fine on its own).
#
# Install once on the VPS:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/smashed_sfs
#   sudo ln -s /etc/nginx/sites-available/smashed_sfs /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN_OR_IP below with your actual domain (or the VPS's
# public IP if you don't have a domain yet). Once you do have a domain and
# want HTTPS, run: sudo certbot --nginx -d YOUR_DOMAIN
# (certbot rewrites this file to add the SSL server block automatically).

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    client_max_body_size 20M;  # CSV/Excel/DTR uploads

    location /static/ {
        alias /home/deploy/smashed_sfs/staticfiles/;
    }

    location / {
        proxy_pass http://unix:/home/deploy/smashed_sfs/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
